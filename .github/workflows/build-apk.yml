name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate Android source archive
        run: |
          cat source.part00.b64 source.part01.b64 source.part02.b64 source.part03.b64 source.part04.b64 source.part05.b64 source.part06.b64 source.part07.b64 source.part08.b64 | tr -d '\r\n' | base64 --decode > FlowMeterOfflineAndroid-source-v1.1.0-buildready.fixed.zip
          unzip -t FlowMeterOfflineAndroid-source-v1.1.0-buildready.fixed.zip
          rm -rf build-src
          mkdir build-src
          unzip -q FlowMeterOfflineAndroid-source-v1.1.0-buildready.fixed.zip -d build-src
          test -f build-src/FlowMeterOfflineAndroid/settings.gradle
          test -f build-src/FlowMeterOfflineAndroid/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build-src/FlowMeterOfflineAndroid
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK=build-src/FlowMeterOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Rename APK
        run: cp build-src/FlowMeterOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk Pengukuran-Debit-Offline-v1.1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pengukuran-Debit-Offline-v1.1.0-debug
          path: Pengukuran-Debit-Offline-v1.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
