name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q FlowMeterOfflineAndroid-source-v1.1.0-buildready.zip -d build-src
          test -f build-src/FlowMeterOfflineAndroid/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build-src/FlowMeterOfflineAndroid
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f build-src/FlowMeterOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build-src/FlowMeterOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build-src/FlowMeterOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pengukuran-Debit-Offline-v1.1.0-debug
          path: build-src/FlowMeterOfflineAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
